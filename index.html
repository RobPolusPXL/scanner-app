<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Ronde Scanner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <strong>Ronde Scanner</strong>
    <span id="status" class="status">Klaar om te starten</span>
    <div class="actions">
      <button id="btnTorch" class="ghost" hidden>Licht</button>
      <button id="btnDebug" class="ghost">Tekst</button>
      <button id="btnList" class="ghost">Lijst</button>
    </div>
  </header>

  <main>
    <section class="cam">
      <video id="video" playsinline muted></video>
      <div class="guide" id="guide"><span>Houd het adres in dit kader</span></div>
      <button id="btnStart" class="start">Start camera</button>
    </section>

    <section id="result" class="result idle">
      <div id="street" class="street">—</div>
      <div id="round" class="round"></div>
      <div id="sub" class="sub"></div>
      <div id="choices" class="choices"></div>
    </section>

    <pre id="debug" class="debug" hidden></pre>
  </main>

  <dialog id="listDlg">
    <div class="dlg-head">
      <input id="filter" type="search" placeholder="Filter straat of ronde (bv. 021)" autocomplete="off">
      <button id="btnClose" class="ghost">Sluiten</button>
    </div>
    <p class="note">Controlelijst: vergelijk met de papieren lijst. Letters A en B (tot Blookweg) ontbreken nog.</p>
    <table id="listTable"><thead><tr><th>Ronde</th><th>Straat</th><th>Nummers</th></tr></thead><tbody></tbody></table>
  </dialog>

  <canvas id="canvas" hidden></canvas>

  <script src="vendor/tesseract.min.js"></script>
  <script src="data/straten.js"></script>
  <script src="js/match.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
