<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Ronde Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <header class="bar">
    <strong>Ronde Scanner</strong>
    <span id="status" class="status">Klaar om te starten</span>
    <div class="actions">
      <button id="btnTorch" class="ghost" hidden>Licht</button>
      <button id="btnDebug" class="ghost">Tekst</button>
      <button id="btnList" class="ghost">Lijst</button>
    </div>
  </header>

  <main>
    <section class="cam">
      <video id="video" playsinline muted></video>
      <div class="guide" id="guide"><span>Houd het adres in dit kader</span></div>
      <button id="btnStart" class="start">Start camera</button>
    </section>

    <section id="result" class="result idle">
      <div id="street" class="street">—</div>
      <div id="round" class="round"></div>
      <div id="sub" class="sub"></div>
      <div id="choices" class="choices"></div>
      <button id="btnMic" class="mic" aria-label="Spreek de straat in">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        <span>Spreek</span>
      </button>
    </section>

    <pre id="debug" class="debug" hidden></pre>
  </main>

  <dialog id="listDlg">
    <div class="dlg-head">
      <input id="filter" type="search" placeholder="Filter straat of ronde (bv. 021)" autocomplete="off">
      <button id="btnClose" class="ghost">Sluiten</button>
    </div>
    <p class="note">Controlelijst: vergelijk met de papieren lijst. Letters A en B (tot Blookweg) ontbreken nog.</p>
    <table id="listTable"><thead><tr><th>Ronde</th><th>Straat</th><th>Nummers</th></tr></thead><tbody></tbody></table>
  </dialog>

  <canvas id="canvas" hidden></canvas>

  <script src="vendor/tesseract.min.js"></script>
  <script src="data/straten.js?v=5"></script>
  <script src="js/match.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
